name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 18.0.0
          extra_plugins: |
            @semantic-release/changelog@6.0.0
            @semantic-release/git@10.0.0
            @semantic-release/exec@6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release artifacts
        if: steps.release.outputs.new_release_published == 'true'
        run: scripts/build-release.sh "${{ steps.release.outputs.new_release_version }}"

      - name: Upload release artifacts
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.release.outputs.new_release_version }}" dist/* --clobber

      - name: Bump Homebrew tap
        if: steps.release.outputs.new_release_published == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        run: scripts/bump-tap.sh "${{ steps.release.outputs.new_release_version }}"

  windows-packages:
    name: Windows packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build packages
        shell: pwsh
        run: scripts/build-windows-packages.ps1 -Version $env:VERSION

      - name: Upload to the release
        shell: pwsh
        run: |
          gh release upload "v$env:VERSION" "dist/awsp.$env:VERSION.nupkg" "dist/awsp-$env:VERSION-setup.exe" "dist/awsp-$env:VERSION-setup.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY

      - name: Publish to Chocolatey
        shell: pwsh
        run: scripts/publish-windows-packages.ps1 -Version $env:VERSION -Dir dist
