<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070709"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Cube Template -->
    <g id="iso-cube">
      <!-- Left face -->
      <path d="M 0 10 L -17 0 L -17 -20 L 0 -10 Z" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Right face -->
      <path d="M 0 10 L 17 0 L 17 -20 L 0 -10 Z" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Top face -->
      <path d="M 0 -10 L -17 -20 L 0 -30 L 17 -20 Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bg_grad)"/>

  <!-- Creative Background Grid -->
  <g opacity="0.4">
    <!-- Grid lines -->
    <path d="M0 40H800M0 80H800M0 120H800M0 160H800M40 0V200M80 0V200M120 0V200M160 0V200 M200 0V200 M240 0V200 M280 0V200 M320 0V200 M360 0V200 M400 0V200 M440 0V200 M480 0V200 M520 0V200 M560 0V200 M600 0V200 M640 0V200 M680 0V200 M720 0V200 M760 0V200" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Data flowing on the grid -->
    <path d="M 0 80 H 800" stroke="#C0FF00" stroke-width="1" stroke-dasharray="30 400" opacity="0.6" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="430" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 0 160 H 800" stroke="#FF9900" stroke-width="1" stroke-dasharray="50 500" opacity="0.5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-550" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 440 0 V 200" stroke="#C0FF00" stroke-width="1" stroke-dasharray="20 200" opacity="0.5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Code Snippet in Background -->
  <g font-family="monospace" font-size="11" fill="#C0FF00" opacity="0.12" filter="url(#glow)">
    <text x="450" y="30">> awsp prod-admin</text>
    <text x="450" y="45">[+] Switched AWS profile</text>
    <text x="450" y="60"> ✔ AWS_PROFILE=prod-admin</text>
    <text x="450" y="75"> ✔ SSO Session active (us-east-1)</text>
    <text x="450" y="90"> ✔ Role: AdministratorAccess</text>
    <text x="450" y="105">> sts get-caller-identity</text>
    <text x="450" y="120"> ✔ Account: 123456789012</text>
    <text x="450" y="135">> ready ⚡</text>
  </g>

  <!-- Distant Floating Cubes -->
  <g opacity="0.3">
    <g transform="translate(380, 50) scale(0.6)">
      <use href="#iso-cube" />
      <animateTransform attributeName="transform" type="translate" values="380,50; 380,40; 380,50" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(480, 175) scale(0.4)">
      <use href="#iso-cube" />
      <animateTransform attributeName="transform" type="translate" values="480,175; 480,190; 480,175" dur="7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(260, 170) scale(0.7)">
      <use href="#iso-cube" />
      <animateTransform attributeName="transform" type="translate" values="260,170; 260,160; 260,170" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Typography matching ops4life style -->
  <g transform="translate(50, 0)">
    <text x="0" y="55" fill="#C0FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="3" filter="url(#glow)">OPS4LIFE TOOLING</text>
    <text x="0" y="108" fill="white" font-family="Arial, sans-serif" font-size="46" font-weight="bold" letter-spacing="-0.5">awsp</text>
    <text x="0" y="142" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18" font-weight="500">AWS Profile Switcher &amp; SSO Login Helper</text>
    
    <rect x="0" y="162" width="80" height="4" rx="2" fill="#C0FF00" filter="url(#glow)"/>
    <!-- Animated accent line extending slightly -->
    <rect x="0" y="162" width="80" height="4" rx="2" fill="#ffffff" opacity="0.8">
      <animate attributeName="width" values="0; 80; 0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0; 0.8" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Centerpiece Logo Group (The Scaffolding Stack with ops4life wave & AWS accents) -->
  <g transform="translate(690, 100) scale(1.5)">
    <!-- Base aura -->
    <circle cx="0" cy="0" r="45" fill="#111111" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- The Stack -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,2; 0,-2; 0,2" dur="4s" repeatCount="indefinite" />
      
      <!-- Bottom Cube -->
      <g transform="translate(0, 16)">
        <use href="#iso-cube" />
      </g>
      
      <!-- Middle Cube -->
      <g transform="translate(0, -2)">
        <!-- Highlight middle cube with AWS orange glow -->
        <!-- Left face -->
        <path d="M 0 10 L -17 0 L -17 -20 L 0 -10 Z" fill="#FF9900" fill-opacity="0.3" stroke="#FF9900" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Right face -->
        <path d="M 0 10 L 17 0 L 17 -20 L 0 -10 Z" fill="#FF9900" fill-opacity="0.4" stroke="#FF9900" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Top face -->
        <path d="M 0 -10 L -17 -20 L 0 -30 L 17 -20 Z" fill="#FF9900" fill-opacity="0.5" stroke="#FF9900" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
      
      <!-- Top Cube -->
      <g transform="translate(0, -20)">
        <!-- Highlight top cube with ops4life green glow -->
        <!-- Left face -->
        <path d="M 0 10 L -17 0 L -17 -20 L 0 -10 Z" fill="#C0FF00" fill-opacity="0.3" stroke="#C0FF00" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Right face -->
        <path d="M 0 10 L 17 0 L 17 -20 L 0 -10 Z" fill="#C0FF00" fill-opacity="0.4" stroke="#C0FF00" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Top face -->
        <path d="M 0 -10 L -17 -20 L 0 -30 L 17 -20 Z" fill="#C0FF00" fill-opacity="0.6" stroke="#C0FF00" stroke-width="1.2" stroke-linejoin="round"/>
        
        <!-- Little floating node above top cube -->
        <circle cx="0" cy="-35" r="3" fill="#C0FF00" filter="url(#glow-strong)">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
    
    <!-- 3D Isometric Orbit Ring -->
    <g transform="scale(1, 0.35)">
      <ellipse cx="0" cy="0" rx="36" ry="36" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="8s" repeatCount="indefinite" />
        <circle cx="36" cy="0" r="3" fill="#C0FF00" filter="url(#glow-strong)" />
        <circle cx="-36" cy="0" r="3" fill="#FF9900" filter="url(#glow-strong)" />
      </g>
    </g>
  </g>
</svg>
