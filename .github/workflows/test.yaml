name: Test

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bats:
    name: bats
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up bats
        uses: bats-core/bats-action@4.0.0

      - name: Run test suite
        run: |
          set -o pipefail
          bats --formatter tap tests/awsp.bats tests/install.bats | tee bats-output.tap

      - name: Publish test report to job summary
        if: always()
        run: |
          total=$(grep -c '^\(ok\|not ok\) ' bats-output.tap || true)
          passed=$(grep -c '^ok ' bats-output.tap || true)
          failed=$(grep -c '^not ok ' bats-output.tap || true)

          {
            echo "## awsp test results"
            echo ""
            if [ "$failed" -eq 0 ]; then
              echo "✅ **${passed}/${total} tests passed**"
            else
              echo "❌ **${failed}/${total} tests failed** (${passed} passed)"
              echo ""
              echo "### Failures"
              echo '```'
              grep '^not ok ' bats-output.tap
              echo '```'
            fi
            echo ""
            echo "<details><summary>Full TAP output</summary>"
            echo ""
            echo '```'
            cat bats-output.tap
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  release-artifacts:
    name: release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build artifacts
        run: scripts/build-release.sh 0.0.0-test

  pester:
    name: pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  psscriptanalyzer:
    name: psscriptanalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint PowerShell
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $exclude = 'PSAvoidUsingWriteHost', 'PSUseApprovedVerbs', 'PSAvoidGlobalVars',
            'PSUseShouldProcessForStateChangingFunctions', 'PSAvoidUsingPositionalParameters',
            'PSUseSingularNouns', 'PSAvoidAssignmentToAutomaticVariable', 'PSReviewUnusedParameter'
          $paths = Get-ChildItem -Path bin, completions, scripts -Recurse -Filter '*.ps1' -ErrorAction SilentlyContinue | ForEach-Object FullName
          if (Test-Path install.ps1) { $paths += (Resolve-Path install.ps1).Path }
          $r = foreach ($p in $paths) { Invoke-ScriptAnalyzer -Path $p -Severity Warning, Error -ExcludeRule $exclude }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  windows-packages:
    name: windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Build, install and uninstall the packages
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $c = New-PesterConfiguration
          $c.Run.Path = './tests/packaging.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
